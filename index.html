<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32271f">
  <meta name="description" content="A private virtual bookshelf and reading companion.">
  <title>Opal Shelf</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <button class="brand" data-nav="home" aria-label="Go to Home">
      <span class="brand-mark">OS</span>
      <span><strong>Opal Shelf</strong><small>your private reading room</small></span>
    </button>
    <button class="button primary" id="add-book-button">＋ Add Book</button>
  </header>

  <main id="app" tabindex="-1">
    <section class="loading-state" aria-live="polite">
      <div class="book-loader"></div>
      <p>Opening your reading room…</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-nav="home" class="active"><span>⌂</span>Home</button>
    <button data-nav="shelf"><span>▥</span>Shelf</button>
    <button data-nav="goals"><span>◎</span>Goals</button>
    <button data-nav="settings"><span>⚙</span>Settings</button>
  </nav>

  <dialog id="book-dialog" class="modal"><div class="modal-shell wide" id="book-dialog-content"></div></dialog>
  <dialog id="form-dialog" class="modal"><div class="modal-shell" id="form-dialog-content"></div></dialog>
  <dialog id="checkin-dialog" class="modal"><div class="modal-shell" id="checkin-dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
